[project]
name = "bloom-studio-backend"
version = "0.0.0"
description = "Bloom studio backend: shared multi-room LLM chat"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-socketio>=5.11",
    "motor>=3.5",
    "langchain-openai>=0.2",
    "langchain-core>=0.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "websockets>=16.0",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
    "langgraph>=0.2",
    "psutil>=7.2.2",
    "pillow>=10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "python-socketio[asyncio_client]>=5.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: end-to-end suite that spawns a live server (requires MongoDB)",
]
filterwarnings = [
    "ignore::langgraph.warnings.LangGraphDeprecationWarning",
]

[tool.uv]
package = false
