<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bloom Client Engine</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden; /* backstop for sub-pixel rounding on fractional DPR */
        background: #0b0b0c;
      }
      #stage {
        width: 100%; /* not 100vw — excludes the scrollbar gutter and matches
                    the clientWidth ViewportController measures */
        height: 100%;
      }
      #stage canvas {
        display: block; /* kill the inline baseline descender gap */
      }
      #spin {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        z-index: 10;
        padding: 12px 28px;
        font:
          600 16px system-ui,
          sans-serif;
        color: #0b0b0c;
        background: #e8e8ea;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
      }
      #spin:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #play-error {
        position: fixed;
        left: 50%;
        top: 24px;
        transform: translateX(-50%);
        z-index: 10;
        padding: 10px 16px;
        font:
          500 14px system-ui,
          sans-serif;
        color: #fff;
        background: #b00020;
        border-radius: 8px;
        max-width: 80vw;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <button id="spin" hidden>Spin</button>
    <div id="play-error" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
